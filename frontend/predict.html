<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Find Nearby Cabs | CabFinder</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background-color: #0b0c10;
      color: #f8f9fa;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #000;
      color: #00b4d8;
      padding: 18px 0;
      text-align: center;
      font-weight: 600;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 10px rgba(0, 180, 216, 0.3);
    }

    #map {
      height: 75vh;
      width: 85%;
      margin: 40px auto;
      border-radius: 14px;
      box-shadow: 0 0 25px rgba(0, 180, 216, 0.2);
      border: 1px solid #1a1a1a;
    }

    .btn-locate {
      background-color: #00b4d8;
      color: #fff;
      font-weight: 600;
      padding: 12px 28px;
      border: none;
      border-radius: 8px;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(0, 180, 216, 0.4);
    }

    .btn-locate:hover {
      background-color: #0077b6;
      box-shadow: 0 0 25px rgba(0, 180, 216, 0.6);
    }

    #result {
      font-size: 17px;
      color: #ccc;
      margin-top: 20px;
      font-weight: 400;
    }

    footer {
      background: #000;
      color: #999;
      padding: 12px 0;
      text-align: center;
      margin-top: 40px;
      border-top: 1px solid #111;
    }

    footer a {
      color: #00b4d8;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    /* Leaflet controls dark mode */
    .leaflet-control-attribution {
      background-color: rgba(0, 0, 0, 0.7) !important;
      color: #ccc !important;
    }
    .leaflet-popup-content-wrapper {
      background-color: #1a1a1a !important;
      color: #f8f9fa !important;
      border: 1px solid #00b4d8;
    }
    .leaflet-popup-tip {
      background: #1a1a1a !important;
    }
  </style>
</head>

<body>
  <header>
    <h2>CabFinder | Live Cab Detection</h2>
  </header>

  <div class="text-center mt-4">
    <button class="btn-locate" onclick="getMyLocation()">Use My Location</button>
    <div id="result" class="mt-3">Click the button to find your nearest cab.</div>
  </div>

  <div id="map"></div>

  <footer>
    <p>© 2025 <strong>CabFinder</strong> | Powered by C++ API & OpenStreetMap | <a href="index.html">Back to Home</a></p>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let map, userMarker, cabMarkers = [];

    function initMap(lat = 12.9716, lon = 77.5946) {
      map = L.map("map").setView([lat, lon], 12);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: '© OpenStreetMap contributors',
      }).addTo(map);
    }

    function getMyLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(showPosition, showError);
      } else {
        alert("Geolocation is not supported by your browser.");
      }
    }

    function showPosition(position) {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;
      document.getElementById("result").innerHTML = 
        `<span style="color:#00b4d8;">Your Location:</span> (${lat.toFixed(4)}, ${lon.toFixed(4)})`;

      if (!map) initMap(lat, lon);
      map.setView([lat, lon], 13);

      if (userMarker) userMarker.remove();
      userMarker = L.marker([lat, lon], { title: "You are here" })
        .addTo(map)
        .bindPopup("<strong>You are here</strong>")
        .openPopup();

      fetch(`http://localhost:8080/find_cab?lat=${lat}&lon=${lon}`)
        .then(res => {
          if (!res.ok) throw new Error("Server not reachable. Start the C++ API first.");
          return res.json();
        })
        .then(data => {
          document.getElementById("result").innerHTML +=
            `<br><span style="color:#00b4d8;"><strong>Nearest Cab:</strong></span> ${data.nearest_cab}<br>
             <span style="color:#00b4d8;"><strong>Distance:</strong></span> ${parseFloat(data.distance_km).toFixed(2)} km`;

          const cabs = [
            { id: "Cab_1", lat: 12.9716, lon: 77.5946 },
            { id: "Cab_2", lat: 12.9352, lon: 77.6245 },
            { id: "Cab_3", lat: 12.2958, lon: 76.6394 },
            { id: "Cab_4", lat: 13.0827, lon: 80.2707 },
          ];

          cabMarkers.forEach(m => m.remove());
          cabMarkers = [];

          cabs.forEach(cab => {
            const marker = L.marker([cab.lat, cab.lon], {
              title: cab.id,
              icon: L.icon({
                iconUrl:
                  cab.id === data.nearest_cab
                    ? "https://maps.google.com/mapfiles/ms/icons/green-dot.png"
                    : "https://maps.google.com/mapfiles/ms/icons/red-dot.png",
                iconSize: [32, 32],
              }),
            })
              .addTo(map)
              .bindPopup(`<strong>${cab.id}</strong>`);
            cabMarkers.push(marker);
          });
        })
        .catch(err => {
          document.getElementById("result").innerHTML = "⚠️ " + err.message;
        });
    }

    function showError(error) {
      alert("Error getting location: " + error.message);
    }

    initMap();
  </script>
</body>
</html>
